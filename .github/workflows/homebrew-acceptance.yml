name: Homebrew acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homebrew:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exercise the public Homebrew install from outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          TAP_REF: ${{ github.sha }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: node "$GITHUB_WORKSPACE/scripts/homebrew-acceptance.mjs"
